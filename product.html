<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details - Amazon Clone</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="amazon_clone.css">
<link rel="stylesheet" href="products.css">
<style>
.pd-wrap{background:#fff;width:1250px;padding:20px;display:flex;gap:25px}
.pd-img{width:450px;height:420px;background-size:cover;background-position:center;border:1px solid #e7e7e7;border-radius:8px}
.pd-info{flex:1}.pd-info h1{font-size:24px;line-height:1.3}
.pd-info .p-stars{font-size:16px}.pd-price{font-size:28px;color:#0f1111;margin:10px 0}
.pd-price s{font-size:15px;color:#565959}.pd-about{margin:15px 0;font-size:14px;line-height:1.6}
.pd-about li{margin:5px 0}.pd-buy{width:260px;border:1px solid #ddd;border-radius:8px;padding:15px;height:fit-content}
.pd-buy .p-price{font-size:24px}.qty-row{margin:10px 0}.qty-row input{width:60px;height:30px;text-align:center}
.big-add{width:100%;background:#FFD814;border:1px solid #FCD200;border-radius:20px;padding:10px;cursor:pointer;margin-top:8px}
.big-buy{width:100%;background:#FFA41C;border:1px solid #FF8A00;border-radius:20px;padding:10px;cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<header>
<div class="navbar">
<a href="amazon_clone.html" class="nav_logo_link"><div class="nav_logo"></div></a>
<div class="location"><i class="fa-solid fa-location-dot"></i><small>Deliver to <b>India</b></small></div>
<div class="nav-search"><div class="dropdown"><select id="searchCategory2"><option>All</option></select></div>
<div class="searchbox"><input type="search" id="searchInput2" placeholder="Search Amazon.in"></div>
<div class="search-icon" id="searchBtn2" style="cursor:pointer"><i class="fa-solid fa-magnifying-glass"></i></div></div>
<a href="cart.html" class="cart-link"><div class="Cart"><i class="fa-solid fa-cart-shopping"></i>
<div class="cart"><b>Cart</b> <span id="cart-count">0</span></div></div></a>
</div>
<div class="navbartwo"><div class="Menu"><i class="fa-solid fa-bars"></i><span><b>All</b></span></div>
<a class="nav2-link" href="products.html">All Products</a>
<a class="nav2-link" href="amazon_clone.html">Home</a></div>
</header>
<main id="pd-main"></main>
<div id="toast"></div>
<script src="products.js"></script>
<script>
(function(){
const id=+new URLSearchParams(location.search).get("id")||1;
const p=(typeof PRODUCTS!=="undefined"?PRODUCTS:[]).find(x=>x.id===id)||PRODUCTS[0];
if(!p){document.getElementById("pd-main").innerHTML="<p>Product not found.</p>";return;}
const off=Math.round((1-p.price/p.mrp)*100);
document.getElementById("pd-main").innerHTML=
'<div class="pd-wrap"><div class="pd-img" style="background-image:url(\''+p.img+'\')"></div>'
+'<div class="pd-info"><h1>'+p.name+'</h1>'
+'<div class="p-stars">'+"★".repeat(Math.round(p.rating))+"☆".repeat(5-Math.round(p.rating))
+"<span>"+p.rating+" | "+p.reviews+" ratings</span></div><hr>"
+'<div class="pd-price"><small>$</small>'+p.price.toFixed(2)+' <s>$'+p.mrp.toFixed(2)+'</s> '
+'<span class="p-off">'+off+'% off</span></div>'
+'<p class="p-ship">FREE delivery '+(p.prime?'<span class="p-prime">✓prime</span>':"")+' | Category: '+p.category+'</p>'
+'<ul class="pd-about"><li>High quality '+p.category.toLowerCase()+' product with warranty</li>'
+'<li>Cash on Delivery available, easy 7-day returns</li>'
+'<li>'+(p.deal?"Today's Deal - limited stock!":"In stock, ships in 24 hours")+'</li></ul>'
+'<a class="view-btn" style="display:inline-block" href="products.html?category='+p.category+'">See more '+p.category+'</a></div>'
+'<div class="pd-buy"><div class="p-price"><small>$</small>'+p.price.toFixed(2)+'</div>'
+'<p class="p-ship">FREE delivery. In Stock.</p>'
+'<div class="qty-row">Qty: <input type="number" id="qty" value="1" min="1" max="10"></div>'
+'<button class="big-add" id="pd-add">Add to Cart</button>'
+'<button class="big-buy" id="pd-buy">Buy Now</button></div></div>';
document.getElementById("pd-add").onclick=()=>{
const q=Math.max(1,+document.getElementById("qty").value||1);
for(let i=0;i<q;i++)addToCart(p.id);};
document.getElementById("pd-buy").onclick=()=>{
const q=Math.max(1,+document.getElementById("qty").value||1);
for(let i=0;i<q;i++)addToCart(p.id);location.href="cart.html";};
document.getElementById("searchBtn2").onclick=()=>{
location.href="products.html?q="+encodeURIComponent(document.getElementById("searchInput2").value);};
if(typeof updateBadge==="function")updateBadge();
})();
</script>
</body>
</html>
